<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatmask</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28" />
    <div>
      <h1>Chatmask</h1>
      <p>Hide sidebar chat names</p>
    </div>
  </header>

  <div class="status" data-on="false">
    <span class="dot"></span>
    <span class="label">Inactive</span>
  </div>

  <button id="toggle" type="button" aria-pressed="false">Activate</button>

  <p class="hint">
    Masks ChatGPT and Claude sidebar chat names. Completely local — nothing is sent to any server.
  </p>

  <script src="popup.js"></script>
</body>

</html>
